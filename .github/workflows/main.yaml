name: CI/CD project-landingpage

on:
  push:
  pull_request:

env:
  AWS_REGION: "eu-west-1"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: REUSE Compliance Check
        uses: fsfe/reuse-action@v1

  deploy:
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    needs: test
    strategy:
      matrix:
        include:
          - folder: impact
            bucket: prod-impact-landingpage
          - folder: mentor
            bucket: prod-mentor-landingpage
    concurrency: deploy-${{ matrix.folder }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Sync to S3 bucket
        uses: noi-techpark/github-actions/aws-s3-bucket-sync@v2
        with:
          access-key-id: ${{ secrets.AWS_S3_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.AWS_S3_SECRET_ACCESS_KEY }}
          region: ${{ env.AWS_REGION }}
          s3-bucket-name: ${{ matrix.bucket }}
          folder: ./src/${{ matrix.folder }}
